<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Photo gallery inspired by Lesotho tourism.">
  <title>Discover Lesotho | Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top site-nav" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Discover Lesotho</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Open navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
          <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact & Booking</a></li>
          <li class="nav-item ms-lg-2"><button id="themeToggle" class="btn btn-sm theme-btn" type="button" aria-label="Switch colour theme">🌙</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    <header class="page-banner">
      <div class="container">
        <span class="eyebrow">PHOTO GALLERY</span>
        <h1>See the spirit of Lesotho</h1>
        <p>Click any picture to open a larger preview. The gallery is controlled with JavaScript.</p>
      </div>
    </header>

    <section class="section-space">
      <div class="container">
        <div class="gallery-grid">
          <button class="gallery-item" type="button" data-image="https://upload.wikimedia.org/wikipedia/commons/8/8d/Maletsunyanefalls.JPG" data-title="Mountain scenery">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/8d/Maletsunyanefalls.JPG" alt="Mountain landscape" loading="lazy">
            <span>Mountain scenery</span>
          </button>
          <button class="gallery-item" type="button" data-image="https://upload.wikimedia.org/wikipedia/commons/4/47/Katse_Dam.jpg" data-title="Highland water and mountains">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/47/Katse_Dam.jpg" alt="Water and mountains" loading="lazy">
            <span>Highland water</span>
          </button>
          <button class="gallery-item" type="button" data-image="https://upload.wikimedia.org/wikipedia/commons/b/b1/Thaba_Bosiu.jpg" data-title="Green mountain valley">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Thaba_Bosiu.jpg" alt="Green mountain valley" loading="lazy">
            <span>Mountain valleys</span>
          </button>
          <button class="gallery-item" type="button" data-image="https://upload.wikimedia.org/wikipedia/commons/8/8d/Maletsunyanefalls.JPG" data-title="Hiking adventure">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/8d/Maletsunyanefalls.JPG" alt="Hikers in mountains" loading="lazy">
            <span>Adventure</span>
          </button>
          <button class="gallery-item" type="button" data-image="https://upload.wikimedia.org/wikipedia/commons/b/b1/Thaba_Bosiu.jpg" data-title="Horse riding">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Thaba_Bosiu.jpg" alt="Horse riding" loading="lazy">
            <span>Pony trekking</span>
          </button>
          <button class="gallery-item" type="button" data-image="https://upload.wikimedia.org/wikipedia/commons/4/47/Katse_Dam.jpg" data-title="Winter mountain scenery">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/47/Katse_Dam.jpg" alt="Snowy mountains" loading="lazy">
            <span>Winter scenery</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- Bootstrap modal is used as our lightbox. -->
  <div class="modal fade" id="galleryModal" tabindex="-1" aria-labelledby="galleryModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content gallery-modal-content">
        <div class="modal-header border-0">
          <h2 class="modal-title h5" id="galleryModalTitle">Photo</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close image preview"></button>
        </div>
        <div class="modal-body pt-0 text-center">
          <img id="galleryModalImage" src="" alt="" class="img-fluid rounded-3">
          <div class="d-flex justify-content-center gap-2 mt-3">
            <button id="galleryPrev" class="btn btn-outline-primary" type="button">← Previous</button>
            <button id="galleryNext" class="btn btn-primary" type="button">Next →</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container py-4 d-flex flex-wrap justify-content-between gap-2">
      <p class="mb-0">Discover Lesotho — Student tourism project.</p>
      <small>&copy; <span class="current-year"></span> All rights reserved.</small>
    </div>
  </footer>

  <div id="toastArea" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
